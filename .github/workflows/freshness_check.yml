name: Content Freshness Check

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 01:00 UTC (한국시간 오전 10시) - 실행 자체가 몇 초짜리라 사용량에 미치는 영향은 미미함
    - cron: '0 1 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 신선도 점검 실행
        run: python scripts/check_freshness.py

      - name: REVIEW_NEEDED.md 변경사항 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add REVIEW_NEEDED.md
          git diff --staged --quiet || git commit -m "update freshness review list [skip ci]"
          git pull --rebase
          git push
